name: saveapawsadminpc
description: "SAVEAPAW Admin Panel - Web Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase Dependencies (same project as mobile)
  firebase_core: ^3.15.2
  firebase_auth: ^5.4.1
  firebase_database: ^11.3.2

  # State Management
  provider: ^6.1.1

  # Fonts
  google_fonts: ^8.1.0

  # Image Picker
  image_picker: ^1.1.2
  flutter_map: 6.1.0
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
