<body>
  <script>
    (async function() {
      try {
        var hadController = false;
        if ('serviceWorker' in navigator) {
          hadController = !!navigator.serviceWorker.controller;
          var registrations = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < registrations.length; i++) {
            await registrations[i].unregister();
          }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            await caches.delete(keys[j]);
          }
        }
        if (hadController && !sessionStorage.getItem('sw_purged_v3')) {
          sessionStorage.setItem('sw_purged_v3', '1');
          window.location.reload();
          return;
        }
      } catch (e) {
        console.warn('Cache purge warning:', e);
      }
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=20261104_3';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
